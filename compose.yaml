services:
  app:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env.deploy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      PUBLIC_ORIGIN: https://${CLOVER_DOMAIN:?Set CLOVER_DOMAIN in .env.deploy}
      CLOVER_DATA_DIR: /app/data
      TRUST_PROXY: "true"
    volumes:
      - clover_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CLOVER_DOMAIN: ${CLOVER_DOMAIN:?Set CLOVER_DOMAIN in .env.deploy}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  clover_data:
  caddy_data:
  caddy_config:
